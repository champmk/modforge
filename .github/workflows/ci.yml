name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No npm install step: ModForge has zero runtime dependencies and zero
      # dev dependencies. Node 24 runs the TypeScript sources directly.
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npx --yes -p typescript tsc --noEmit
