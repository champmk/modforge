name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No install needed to run or test: ModForge has zero runtime
      # dependencies and Node 24 runs the TypeScript sources directly.
      - name: Run tests
        run: npm test
      # Typechecking alone needs the compiler and Node's type definitions.
      - name: Fetch typecheck tooling
        run: npm install --no-save --no-package-lock typescript @types/node
      - name: Typecheck
        run: npx tsc --noEmit
